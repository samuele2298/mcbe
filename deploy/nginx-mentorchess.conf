# Da includere nel server nginx esistente (senza dominio: http://<ip>/mentorchess/)
location = /mentorchess { return 301 /mentorchess/; }

location /mentorchess/api/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location /mentorchess/ {
    alias /mentorchess/mcfe/build/web/;
    try_files $uri $uri/ /mentorchess/index.html;
}
