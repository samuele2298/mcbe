name: chess-mentor

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # configurazione a bassa memoria: il VPS ha ~2 GB liberi in tutto
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: 3000
      ENGINE_URL: http://engine:4000
      KNOWLEDGE_DIR: /app/knowledge
    # la knowledge base (markdown in git) si indicizza da qui: docker compose exec api node dist/cli/kb-index.js
    volumes:
      - ./knowledge:/app/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
    # nginx sul host fa da reverse proxy verso 127.0.0.1:3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    mem_limit: 256m

  engine:
    build:
      context: .
      dockerfile: services/engine/Dockerfile
    restart: unless-stopped
    environment:
      STOCKFISH_PATH: /usr/local/bin/stockfish
      STOCKFISH_HASH_MB: 64
      STOCKFISH_THREADS: 1
      ENGINE_PORT: 4000
    # esposto solo su localhost per lo sviluppo dell'API fuori da Docker
    ports:
      - "127.0.0.1:${ENGINE_HOST_PORT:-4000}:4000"
    # Stockfish 19 + rete NNUE occupano ~330 MB
    mem_limit: 448m
    cpus: 1.5

volumes:
  pgdata:
